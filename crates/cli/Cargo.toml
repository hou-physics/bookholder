[package]
name = "bookholder"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bookholder"
path = "src/main.rs"

[dependencies]
bookholder-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
serde_json = { workspace = true }
rusqlite = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
