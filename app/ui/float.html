<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Bookholder Float</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="float-body">
  <div id="float">
    <div class="f-top">
      <span id="f-project">—</span>
      <span id="f-badge" class="badge">…</span>
      <span id="f-model" class="dim"></span>
      <button id="f-hide" title="隐藏悬浮窗（从菜单栏图标可恢复）">–</button>
    </div>
    <div class="f-nums">
      <div><label>今日</label><b id="f-today">$0</b></div>
      <div><label>当前项目</label><b id="f-proj">$0</b></div>
      <div><label>燃烧率/时</label><b id="f-burn">$0</b></div>
    </div>
    <div id="f-active" class="f-active"></div>
    <div id="f-spark" class="spark"></div>
    <div class="spark-axis"><span>24 小时前</span><span>每柱 = 1 小时</span><span>现在</span></div>
  </div>
  <script type="module" src="/src/float.ts"></script>
</body>
</html>
